services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rng
      POSTGRES_PASSWORD: rng
      POSTGRES_DB: rng_audit
    ports:
      - "5432:5432"
    volumes:
      - rng_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rng -d rng_audit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rng_pgdata:
